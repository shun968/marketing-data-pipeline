[project]
name = "sns-collector"
version = "0.1.0"
description = "新規事業開拓分析のためのSNS(Bluesky/YouTube/Hacker News)キーワード検索データ収集ツール"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "duckdb>=1.1,<2",
]

[project.scripts]
sns-collector = "sns_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sns_collector"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]
