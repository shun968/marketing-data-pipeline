# 観測対象ドメインの定義
#
# 役割:
#   1. 事業仮説とその検証手段を明示する（何を確かめたくて収集しているのか）
#   2. 構造化抽出(Phase 2)における `insights.domain` の統制語彙となる
#      → ここに定義された id 以外を抽出結果に入れてはならない
#
# フィールドの意味:
#   sns_collection  **この基盤で収集しているか**（SNSに限らない。GitHub Issues や
#                   Hacker News も含む）。false は「収集せず、抽出時の分類先としてのみ使う」。
#                   どのプラットフォームで収集しているかは note に書く
#   expected_signal 収集で得られる需要シグナルの期待量。金の流れ(hnjobs)の量ではない
#   boundary        抽出時に隣接ドメインと取り違えないための境界。**任意フィールド**。
#                   ここに書いた内容は抽出プロンプトへ渡る（`{domain_guide}`）。
#                   散文の note は渡らないため、分類に効かせたい区別はこちらへ書く
#
# 関連: docs/requirements.md §3 / docs/design.md §3.2
# 最終更新: 2026-08-11

domains:
  - id: ai_accuracy
    label: AI精度・モデル評価の実務
    hypothesis: |
      「ベンチマーク上の精度は出ているのに、現場では使えない」という痛みが
      実在し、SNS上で言語化されているか。
      具体的には、誤検知の多さ、閾値設計の難しさ、学習データと本番データの
      乖離、アノテーションコストなど。
    service_candidate: |
      本命。制約下の実効精度を測るベンチマークハーネス、および
      評価設計に関する教材。
    boundary: ライセンス・法務の問題は含まない（現状の語彙では other へ落ちる）
    sns_collection: true
    expected_signal: 低〜中
    note: |
      個人開発者・研究者・Kaggle層は業務上の制約が緩く、SNSでの発話が活発。
      この層は教材やツールの初期顧客にもなりうる。

      2026-08-02 の実測で下方修正した（当初は「高」）。英語圏でも生の声は薄く、
      候補10件のうち採用できたのは2件のみ。上位を占めたのは arXiv論文bot と
      HuggingFaceフォーラムのブリッジ投稿で、いずれも「困っている人の言葉」ではない。

      2026-08-03、実収集でさらに厳しい結果が出た。英語2語の合計は5件（bot除外後）で、
      困りごと表現を含むものは0件。**英語圏ではこの領域の需要シグナルを観測できていない。**
      日本語側は機能している（物体検知 精度24件 / YOLO 精度23件 等）ため、
      ドメインごと打ち切るのではなく、英語での観測を続けて判定材料を溜める。
      SNS以外の検証手段（記事への反応、競合ツール調査）の併用を前提に置く。

      2026-08-11、GitHub Issues で Ultralytics のライセンス問題が集中して
      観測された（50件の大半が「商用利用できるか」「AGPLの解釈」で、同じ質問が
      繰り返されている＝公式の回答が機能していない）。Bluesky側でも
      「YOLOをラズパイで使っていたがAGPL3.0のため業務利用できず代替探しに苦労」
      という痛みが独立に観測されており、hnjobs でもCV求人は22件（17%）ある。

      **ただし選択バイアスに注意。** GitHub側の50件は
      `repo:ultralytics/ultralytics "commercial license"` という
      キーワードで集めたものであり、「発見」ではない。独立性があるのは
      Bluesky側の1件だけである。この仮説を追うなら、ライセンスを狙わない
      キーワードで周辺を引き直し、痛みが再現するかを先に確かめること。

  - id: edge_ai
    label: エッジデバイスでのAI実行
    hypothesis: |
      Jetson / Raspberry Pi 等の制約ハードで推論を動かす際の、
      速度・精度・メモリのトレードオフに困っている層が実在するか。
      量子化による精度劣化、変換ツールチェーンの詰まり、fpsが出ない等。
    service_candidate: |
      本命。実効精度ハーネスの主要な適用先。
      「このデバイスで、このレイテンシ予算で、実際に何%出るのか」に答える。
    boundary: 「推論を動かす」ことの困りごとに限る。推論を伴わない組込み開発は embedded_dev
    sns_collection: true
    expected_signal: 中〜高
    note: |
      ホビー層・個人開発者は発話する。企業の組込み技術者は発話しない。
      観測できるのは前者のみである点に注意。

      2026-08-03 の実収集（同日14:05Z時点のDBで集計）: 118件（bot除外後）で
      困りごと表現は12%。日本語全体(7%)よりやや高い程度で、3ドメイン中では中位。
      内容は「ローカルLLMはRAMを食う」等の**論評**と構築報告が多く、実際に
      詰まっている人の声は少ない。実機を買った後の落胆（jetson nano slow、
      痛み33%）に絞ると密度が上がるため、キーワードは体験の失敗に寄せるほど効く。

      なお痛み率0%だった coral tpu / frigate detection を外す前は 199件 7% だった。
      同じドメインでも構成で数字が変わるため、比較するときは語の構成を揃えること。

      2026-08-11、hnjobs で**エッジ推論を専門とする求人は薄いことが分かった**。
      求人125件のうち該当は6件（4%）で、実質は2件（ドローン検知のエッジ推論、
      LLMのKVキャッシュ圧縮）。残りは大企業の一括投稿や要件列挙への混入だった。
      「量子化・推論最適化の専門家」を単独の職として雇う会社はほぼ無い。

      **これは「需要が無い」ではなく「単独の専門サービスとしては売りにくい」
      と読むべきである。** 組込みエンジニアの業務に溶けている可能性が高く、
      実際 組込み関連の求人は29%ある（embedded_dev として分離した）。
      service_candidate（実効精度ハーネス）は、単体で売るより
      ロボティクス・組込みの文脈へ埋め込む形を検討する。

  - id: fabrication
    label: 3Dプリンタ・機構設計・自作装置
    hypothesis: |
      設計データ・作例・解説に対する支払い意思が観測できるか。
      造形精度の悩み、治具設計、ロボットアーム/ジンバル等の機構自作。
    service_candidate: |
      併走。設計データ + 解説 + 制御コードのDL販売。
      在庫ゼロ・発送ゼロ・サポート最小で制約との相性が最良。
    boundary: 造形・機構そのもの。ロボットのソフトウェア側は robotics_tooling
    sns_collection: true
    expected_signal: 高
    note: |
      趣味層は活発に発話し、作例の共有文化がある。
      支払い意思の観測が最重要（無料文化が強い領域でもあるため）。

      2026-08-02 の実測で、英語圏がこの3ドメイン中もっとも濃いことを確認した。
      造形失敗・定着不良の話題は50件近く取れて、なお投稿者が分散している。
      日本語圏で在庫を回収しきった後の主戦場はここになる。

      2026-08-03 の実収集で裏付けた（同日14:05Z時点）。184件（bot除外後）のうち
      困りごと表現を含むものが44%。日本語全体(7%)の6倍で、3ドメイン中で突出している。
      とくに造形失敗（resin print failed 81% / 3d print failed 65%）が高い。
      **Phase 2 の抽出はこのドメインから始めるのが最も期待値が高い。**

      2026-08-11、hnjobs（求人・案件）で**このドメインの求人は0件だった**。
      "3d printing" も "cnc" も、求人3本・案件3本のどちらでも1件も無い。
      痛み率44%と3ドメイン中で突出しているのに、企業の予算が1件も観測できない。
      **「痛みはあるが誰も金を払っていない」を示す、この基盤で初めての実測値である。**
      需要シグナルだけでは、この状態を弾けなかった。

      加えて、痛みの中身がハードウェア側で解消されつつある。抽出済みの
      `advantage` 7件のうち5件が「Bambuの自動キャリブレーションが挫折点を
      解消した」旨で、造形失敗という痛みそのものが縮小方向にある。
      **service_candidate（設計データのDL販売）は、この2点を踏まえて
      見直しが要る。** 収集は続けるが、事業候補としての優先度は下げる。

  - id: robotics_tooling
    label: ロボティクス開発の道具
    hypothesis: |
      ROS2 / MoveIt / Nav2 / Foxglove といった、ロボットを作るための道具に
      対する不満が実在し、支払い能力のある層のものとして観測できるか。
      デバッグの難しさ、ドキュメントの不足、シミュレータの遅さ、
      機体をまたいだ再現性など。
    service_candidate: |
      未定（仮説検証前）。この領域には既にツールを売る会社がある
      （Foxglove = 可視化、Viam = 統合基盤、Bucket Robotics = CAD→CVモデル）。
      個人開発で入るなら、それらが埋めていない隙間を先に特定する必要がある。
    boundary: ROS2 / MoveIt / Nav2 / Foxglove 等の道具への不満。AI推論そのものは edge_ai
    sns_collection: true
    expected_signal: 中
    note: |
      **収集はGitHub Issuesが主になる。** Bluesky・Hacker Newsのキーワードは
      持たない。ロボティクスの開発者は、困りごとを本家リポジトリのIssueへ書く。

      2026-08-11、hnjobsとGitHub Issuesの初回収集で、このドメインを追加した。
      求人125件のうち32%がロボティクス関連で、観測できた領域の中では最大だった
      （建設ロボ・製造業AI・航空など、物理世界で動くものを作る会社が中心）。
      GitHub Issuesは158件（ros2 / ros-navigation / moveit / foxglove）。

      **給与レンジは下限中央値$150k・上限中央値$200k。** 人が高いということは、
      その工数を削る道具に払う余地があるということでもある。
      ただし「何に困っているか」はまだ読めていない。求人票に困りごとは書かれず、
      Issueの中身は個別のバグ報告が多い。次はIssueの構造化抽出が要る。

  - id: embedded_dev
    label: 組込み開発（RTOS・SDK・ツールチェーン）
    hypothesis: |
      Zephyr / ESP-IDF / PlatformIO 等での開発の苦痛が観測できるか。
      ビルドの通らなさ、ドキュメントの分かりにくさ、デバッグ手段の乏しさ、
      ボード差異の吸収など。**AI推論は含まない**（それは edge_ai）。
    service_candidate: |
      未定（仮説検証前）。
    boundary: AI推論を伴うものは edge_ai。ロボット固有の道具は robotics_tooling
    sns_collection: true
    expected_signal: 中
    note: |
      **edge_ai と重なるようで、別の領域である。** edge_ai は「制約ハードで
      推論を動かす」ことの困りごとで、こちらは推論の有無によらない組込み開発
      そのもの。求人でもこの2つは別の職として募集されている。

      2026-08-11 に追加。求人125件のうち29%が組込み関連で、ロボティクスに次ぐ。
      GitHub Issuesは171件（zephyrproject-rtos / espressif / platformio）。
      Issueの中身は「SPI DMAでnocacheバッファが提供されない」「xtensa_elf_relocate
      が不正コードを生成」といった深い技術バグが主で、**外部のツールが入る隙は
      薄く見える**。個人開発のサービス候補としては、現時点では有望に見えない。

  # --- 以下はSNS収集の対象外。抽出時の分類先としてのみ使用する ---

  - id: inference_placement
    label: 推論の配置設計（エッジ/クラウド）
    hypothesis: |
      通信コスト・セキュリティ要件・実効精度を同時に満たす配置をどう決めるか。
      エッジのスペック低下が試行回数を削り、実効FRRを悪化させ、
      結果として閾値を緩めさせてセキュリティ強度を下げる——という
      軸の連鎖を扱える設計者がいない、という仮説。
    service_candidate: |
      本命の中核となる知見。売り方は相談受けではなく、
      デプロイ用テンプレートの売り切り、および発信によるスポット案件の呼び込み。
    sns_collection: false
    expected_signal: 低
    note: |
      想定顧客（SIer・情シス・製造業の組込み技術者）は守秘義務があり、
      業務上の悩みを公開SNSに書かない。本基盤では検証できない。
      検証手段を分ける: 記事を書いて反応を見る / 競合ツール調査 / 直接ヒアリング。
      SNS上に稀に現れた場合の分類先としてのみ、この語彙を保持する。

  - id: other
    label: 該当なし・分類不能
    hypothesis: null
    service_candidate: null
    sns_collection: false
    expected_signal: null
    note: |
      上記のいずれにも当てはまらない場合の受け皿。
      このドメインの比率が高い場合、キーワード設計が空振りしている兆候である。

# 改訂履歴
# 2026-08-11 ドメインを2つ追加し、既存3ドメインの note を更新した（issue #71）。
#   金の流れシグナル（hnjobs、ADR-0010）とGitHub Issuesの初回収集を材料にした。
#   **統制語彙への追加のみで、既存idの変更・削除はしていない。**
#   抽出済みの insights はそのまま有効である。
#
#   追加した2ドメインと、その根拠（求人125件 / GitHub Issues 479件）:
#     robotics_tooling  求人32% / Issues 158件  ← 観測できた中で最大の領域
#     embedded_dev      求人29% / Issues 171件
#   どちらも既存の統制語彙に収まらず、放置すると329件が other へ落ちる状態だった。
#
#   **fabrication の求人は0件だった。** SNS側の痛み率44%（3ドメイン中で突出）に
#   対し、企業の予算が1件も観測できない。「痛みはあるが誰も金を払っていない」を
#   示す、この基盤で初めての実測値である。需要シグナルだけではこの状態を弾けず、
#   収集元を分けたこと（ADR-0010）で初めて見えた。
#
#   **エッジ推論の専任求人は125件中6件（実質2件）だった。** edge_ai の
#   service_candidate（実効精度ハーネス）を単体で売る前提は弱まる。一方で
#   組込みの求人は29%あり、これは推論の有無によらない領域として分離した。
#
#   **語彙を分けた前後で、ドメイン別の件数を比較しないこと。** 分割前の
#   edge_ai には組込みの内容が混ざっている（当時それしか受け皿が無かった）。
#   report の「前期間比」はこの断絶を知らないため、edge_ai が語彙の理由で
#   減ったように見える。keywords.yaml の「比較するときは語の構成を揃える」と
#   同じ注意が、ドメイン側にも要る。
#
#   **Ultralyticsのライセンス問題に対応する語彙は、今回は足さなかった。**
#   GitHub Issuesで50件観測されたが、これは `"commercial license"` という
#   キーワードで集めたものであり選択バイアスがある（ai_accuracy の note 参照）。
#   現状の語彙では other へ落ちる。ライセンスを狙わないキーワードで再現するかを
#   確かめてから、語彙を足すかを判断する。**先送りであって、見落としではない。**
#
#   expected_signal は既存3ドメインとも変更していない。今回の材料は
#   「金の流れ」であり、SNSでの需要シグナルの期待量を動かす根拠ではない。
#   金の流れを構造化された欄として持つかは、観測が1回分しかないため見送った。
#
# 2026-08-03 実収集データによる検証結果を各ドメインの note へ追記した（issue #12）。
#   前回(08-02)は公開検索APIでの事前実測。今回は実際に収集した445件をDBで評価した。
#   expected_signal の値は変更していない。08-02 の見立てが実データでも成立したため。
#   判定はキーワード単位の数値とともに config/keywords.yaml の改訂履歴に残した。
#
# 2026-08-02 英語圏の実測に基づき expected_signal を見直した（issue #12）。
#   検証対象が「日本語圏に需要シグナルがあるか」から「英語圏にあるか」へ移ったため。
#   ai_accuracy: 高 → 低〜中（英語圏でもbotが支配的で生の声が薄い）
#   fabrication: 高のまま（英語圏が最も濃いことを確認）
#   edge_ai:     中〜高のまま（実機を買った後の落胆が英語で取れる）
#   統制語彙（id）は変更していない。抽出結果との互換性は保たれる。
#
# 2026-07-29 初版作成。
#   - 旧キーワード(新規事業/スタートアップ アイデア)は目的とズレるため廃止した。
#     「新規事業について語る人」しか取れず、市場の生の不満が取れていなかった。
#   - inference_placement は当初SNS収集対象としていたが、想定顧客が
#     SNSで発話しない層であるため対象外へ変更した。
