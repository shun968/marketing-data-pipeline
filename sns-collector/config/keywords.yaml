# 検索キーワード定義
#
# 設計方針: docs/requirements.md §3 / README.md「キーワード設計の原則」
#   - Bluesky = 需要シグナル。投稿本文から未充足ニーズ・不満の生の表現を拾う
#   - YouTube = 供給シグナル。動画メタデータしか検索できないため、痛みを表す語は
#     投げない。既存ソリューション・競合・市場の関心度の測定に用途を限定する
#   - Hacker News = 需要シグナル（ADR-0006）。コメント本文・Ask HN投稿から
#     Blueskyと同種の生の困りごとを拾う。役割はBlueskyと同じだが、コーパスが
#     小さくノイズの出方が異なるため、キーワード自体は別に検証している
#   - hnjobs = 金の流れシグナル（ADR-0010）。Hacker Newsの月次求人・案件スレッドから、
#     企業・発注者が実際に予算を付けている領域を見る。**困りごとは取れない。**
#     需要シグナル側が「痛みはあるが誰も金を払っていない」領域を弾けないため、
#     支払いの実在をこちらで確かめる
#
# 【最重要】キーワード設計の3原則
#
#   原則1. 固有名詞・技術用語のアンカーを必ず含める。（2026-07-29 実測 / 言語を問わない）
#     Bluesky検索は日本語のスペース区切りを厳密なANDとして扱わず、部分一致も起きる。
#     日本語には語境界がないため、一般語（精度/難しい/足りない）だけを組み合わせると
#     ノイズが支配的になる。英語でも `wish someone would make` は成立しない。
#
#   原則2. 英字の固有名詞には必ず日本語の語を添える。（2026-07-29 実測）
#     **日本語圏を狙うキーワードにのみ適用する。** 英字のみのキーワードは
#     英語圏の投稿・公式アカウントの宣伝・bot投稿を拾い、日本語圏の生の声が取れない。
#       ラズパイ YOLO ◎ / Jetson 動かない ○  ←→  Jetson Orin △ / OpenVINO ✗
#     英語圏を狙うキーワードは、この原則の対象外である（狙って英字のみにする）。
#
#   原則3. 英語では取得件数が質のシグナルにならない。（2026-08-02 実測）
#     日本語のノイズは語境界が無いことによる部分一致で、件数に比例して増えた。
#     英語には語境界があり同種の衝突が起きにくいため、「50件＝ノイズ」は成立しない。
#     代わりにノイズは**アカウントの種別**に宿る。判定材料を上位アカウントの偏りへ移す。
#       3d print failed  50件・最大2件/アカウント → 生の声が支配 ◎
#       cuda out of memory 50件・HuggingFaceブリッジが23件 → ✗
#
#   キーワードの役割は「領域を絞る」ことに徹させ、痛みかどうかの判定は
#   Phase 2 の構造化抽出に委ねる。
#
# 行末の [実測◎/○/△] は実データで質を確認済みであることを示す。印のないものは未検証。
#   ◎ 需要シグナルの密度が高い / ○ 使える / △ 領域は合っているが密度が低い
# **どちらも収集データでの評価であり、検索結果のサンプリングではない。**
# 違うのは判定方法で、日本語は本文の目視（2026-07-29、初回収集750件）、
# 英語は件数・bot率・痛み率の数値（2026-08-03、DBで集計）。
# 英語側の数値の出し方は末尾の改訂履歴に書いてある。
#
# ドメインの定義と仮説: config/domains.yaml
# 最終更新: 2026-08-11

bluesky:
  sort: latest # latest | top
  limit_per_keyword: 50 # 1リクエストあたり取得件数(最大100)
  keywords:
    # ── D1: AI精度・モデル評価の実務 (domain: ai_accuracy) ──────────────
    - "物体検知 精度" # [実測○] 物体検知AIの技術ニュース中心
    - "顔認証 誤認識" # [実測○] 顔認証の特徴点・運用の議論
    - "アノテーション 面倒" # [実測○] アノテーション作業・労働環境
    - "YOLO 精度" # [実測○] OCR/量子化まわりの実装話
    - "アノテーションツール" # [実測○] 日本語表記のため言語ノイズが出にくい
    - "COCO データセット" # [実測○] 件数は少ないが的確
    - "物体検出 誤検知"
    - "YOLO 学習 うまくいかない"

    # ── D2: エッジデバイスでのAI実行 (domain: edge_ai) ──────────────────
    - "ラズパイ YOLO" # [実測◎] 「何度OSごと書き換えたことか」等、痛みシグナルそのもの
    - "Raspberry Pi 推論" # [実測○] ARM64での自作実装など
    - "Jetson 動かない" # [実測○] Jetson系ボードの実機トラブル
    - "Jetson 遅い" # [実測○] 同上。件数は少ないが的確
    - "TensorRT 変換" # [実測○] ONNX→TensorRT変換のエラー解説
    - "量子化 INT8" # [実測○] 「量子化」単体は中国語の量子化学に流れるためINT8で限定する
    - "Jetson 推論" # 「Jetson Orin」等の英字のみは英語圏に流れるため日本語を添える
    - "OpenVINO 変換" # 同上。「OpenVINO」単体はGitHubトレンドbotが支配していた
    - "ONNX 推論" # 同上。「ONNX Runtime」単体はスペイン語記事等に流れていた

    # ── D3: 3Dプリンタ・機構設計・自作装置 (domain: fabrication) ─────────
    - "3Dプリンタ 治具" # [実測○] 実際の造形物・用途の共有
    - "3Dプリンタ 設計データ" # [実測○] モデル配布・作り方の共有
    - "3Dプリンタ 造形失敗"
    - "ロボットアーム 自作"
    - "パラレルリンク 機構" # 「パラレルリンク」単体は遊戯王のカード名に流れるため限定する
    - "ジンバル 自作"
    - "ステッピングモータ 制御"
    - "STLデータ" # 「STL」単体はC++標準テンプレートライブラリと衝突するため限定する

    # ══ 英語圏 ══════════════════════════════════════════════════════════
    # 日本語圏の在庫を初回で回収しきったため（issue #12）、主軸を英語へ移す。
    # 日本語は量が少ないが質が高いため残し、英語を主・日本語を従とする。
    # 原則2は適用しない（狙って英字のみにする）。原則3で上位アカウントを見る。

    # ── D1: AI精度・モデル評価の実務 (domain: ai_accuracy) ──────────────
    # この領域は英語圏でもbotが支配的で、生の声は薄い。2件しか残らなかった。
    # 却下した候補と根拠は末尾の改訂履歴を見ること
    - "confidence threshold tuning" # [実測△] 4件。検索時は的確だったが収集では痛み表現0%
    - "yolo false positives" # [実測△] 2件。同上。英語圏のD1は観測できていない

    # ── D2: エッジデバイスでのAI実行 (domain: edge_ai) ──────────────────
    - "jetson nano slow" # [実測◎] 9件・bot0%・痛み33%。少数だが密度は最高
    - "llama.cpp raspberry pi" # [実測△] 39件・bot23%・痛み3%。論評が多い
    - "ollama slow" # [実測○] 49件・bot14%・痛み7%
    - "local llm slow" # [実測○] 48件・bot23%・痛み19%。D2では最良

    # ── D3: 3Dプリンタ・機構設計・自作装置 (domain: fabrication) ─────────
    # 英語圏で最も濃い領域。3件が50件近く取れて、なおアカウントが分散している
    - "3d print failed" # [実測◎] 50件・bot4%・痛み65%。全キーワード中で最良
    - "resin print failed" # [実測◎] 48件・bot0%・痛み81%。同上
    - "first layer adhesion" # [実測○] 50件・bot32%・痛み24%。bot比率は最悪だが実signalも多い
    - "3d printing jig" # [実測△] 25件・bot16%・痛み10%。作例共有が主
    - "robot arm diy" # [実測△] 43件・bot23%・痛み3%。製作記が主

youtube:
  order: relevance # relevance | date | rating | viewCount
  max_results_per_keyword: 25 # 1回あたり取得件数(最大50)
  region_code: JP
  relevance_language: ja
  # 供給シグナル用。「どんな解決策が既に存在し、どれだけ関心を集めているか」を測る。
  #
  # 2026-07-29 実測: 9キーワードすべて的確。Blueskyで起きた原則1/原則2の問題は
  # 出なかった。Googleの関連度ランキングが日本語でも有効に働くため。
  #
  # 【注意】YouTubeでは取得件数が質のシグナルにならない。
  #   関連度順で常に maxResults まで返るため、全キーワードが一律25件になる。
  #   Blueskyでは「50件=ノイズ」が有効な判定材料だったが、ここでは使えない。
  #   質の確認は必ずタイトル・説明文のサンプリングで行うこと。
  keywords:
    # ── D1 / D2: AI実装・エッジ推論 ────────────────────────────────────
    - "物体検知 実装" # [実測○] YOLO解説・実装チュートリアル
    - "YOLO 使い方" # [実測○] YOLOv8チュートリアル、物体検出入門
    - "AI 推論 高速化" # [実測○] 分散推論、Diffusion推論高速化、AI専用命令
    - "エッジAI 物体検知" # [実測◎] ASUS IoT/MOBOTIX等、既存製品の宣伝が取れる
    - "Jetson YOLO" # [実測○] Jetson Orin Nano速度テスト等
    - "Raspberry Pi AI" # [実測○] Raspberry Pi 5でのAI環境構築

    # ── D3: 3Dプリンタ・機構 ──────────────────────────────────────────
    - "3Dプリンタ ロボットアーム" # [実測◎] 6自由度アーム、逆運動学解説
    - "パラレルリンク ロボット" # [実測◎] FANUC M-2iA、山洋電気等の産業用機
    - "3Dプリンタ 治具" # [実測○] 治具のDIY実例

hackernews:
  tags: "(story,comment)" # Algoliaのタグフィルタ。story=投稿本文、comment=返信
  # 括弧が無いとAND(story かつ comment を同時に満たす、常に0件)になる
  hits_per_page: 50
  # 需要シグナル用（Blueskyと同役割）。コーパスがBlueskyより桁違いに小さく、
  # 4語以上の完全一致フレーズはほぼ0件になる（事前確認）。2〜3語のフレーズに
  # 限定語を1語添える形（"完全一致フレーズ" 追加語）が最も安定した。
  #
  # [実測] は2026-08-08の実収集203件をDBで評価した値（改訂履歴参照）。
  # 判定は「困りごと表現を含む一人称の投稿の割合」（i tried / doesn't work /
  # too slow 等の正規表現。Bluesky側と同種の粗い代理指標）。
  keywords:
    # ── D3: 3Dプリンタ・機構設計・自作装置 (domain: fabrication) ─────────
    - '"3d printer" failed' # [実測○] 47件・痛み23%。3ドメイン中で最良
    - '"bed adhesion"' # [実測△] 20件・痛み5%
    - '"failed print"' # [実測△] 20件・痛み0%。話題は的確だが一人称の痛み表現は薄い
    - '"resin printer" failed' # [実測△] 1件のみ（母数不足で判定不能）

    # ── D2: エッジデバイスでのAI実行 (domain: edge_ai) ──────────────────
    - '"jetson nano"' # [実測✕] 50件・痛み0%。実機の話題は多いが困りごと表現がほぼ無い
    - '"quantization accuracy"' # [実測△] 3件のみ（母数不足で判定不能）
    - '"raspberry pi" jetson' # [実測✕] 46件・痛み2%。比較文脈が主でノイズも多い

    # ── D1: AI精度・モデル評価の実務 (domain: ai_accuracy) ────────────────
    # Bluesky同様この領域は弱い（domains.yaml）。実収集でも裏付けられた。
    # 件数が少なく抽出バッチへの負荷が小さいため観測点として残す
    - '"model accuracy" edge' # [実測✕] 16件・痛み0%・うち69%が「Ask HN: Who is hiring?」の求人枠混入

hnjobs:
  # 対象スレッド。hired(求職)は「金を出す側」ではないため採らない。
  # **freelancer は実測では受注側の売り込みが支配的である**（2026年8月の案件
  # スレッドはトップレベル14件すべてがSEEKING WORKで、発注側は0件）。
  # 金の流れとして数えず、供給側の観測として使うこと。発注側／受注側の別は
  # posts.metrics の seeking に入る（hiring側は名乗りが無いため常にnull）
  thread_kinds: ["hiring", "freelancer"]
  thread_limit: 3 # 種別ごとの遡り月数。求人3本+案件3本 = 6スレッド
  hits_per_page: 50
  # 金の流れシグナル用。**役割が他と違うので、痛みを表す語を投げない。**
  # 求人票は「その領域に予算が付いている」こと自体が信号であり、
  # 困りごと表現は構造的に含まれない。
  #
  # 判定は「その技術領域の求人か」を本文サンプルで見る。件数だけでは判定できない
  # （下の "edge" が典型。48件取れたが中身は "sharp edges" と "cutting-edge"）。
  #
  # [実測] は2026-08-11に求人3本(2026年6〜8月)・案件3本(同)へ問い合わせた
  # トップレベルコメント数。スレッド直下＝1件の求人票（返信は議論なので数えない）。
  # 形式は 求人 / 案件。
  keywords:
    # ── D2: エッジデバイスでのAI実行 (domain: edge_ai) ──────────────────
    - '"robotics"' # [実測◎] 37 / 2
    - '"embedded"' # [実測◎] 30 / 2
    - '"inference"' # [実測○] 19 / 1
    - '"firmware"' # [実測◎] 15 / 1
    - '"iot"' # [実測○] 10 / 0
    - '"quantization"' # [実測△] 3 / 0。少数だが領域は的確

    # ── D1: AI精度・モデル評価の実務 (domain: ai_accuracy) ────────────────
    - '"machine learning"' # [実測○] 31 / 0。領域は広いが的確
    - '"computer vision"' # [実測◎] 21 / 3

    # ── D3: 3Dプリンタ・機構設計・自作装置 (domain: fabrication) ─────────
    # **この領域の求人は存在しない。** 0件であること自体が判定材料なので、
    # バッチ負荷ゼロの観測点として残す（"cnc" も0件だった）
    - '"3d printing"' # [実測✕] 0 / 0

github:
  qualifiers: "is:issue" # 外すとPull Requestも混ざる
  per_page: 50
  # 需要シグナル用。**開発者が使っているツールへの不満**を、本家リポジトリの
  # Issueから一次情報で拾う。狙いはhnjobs（金の流れ）との対で、
  # 「予算が付いている領域で、既存ツールの何が足りていないか」を見ること。
  #
  # 【最重要】org: / repo: で必ず限定する。**限定しないと使い物にならない。**
  # 無限定の `ros2 "hard to debug"` は30件中26件が単一のAI生成ダイジェスト
  # リポジトリだった（2026-08-11 実測）。Blueskyの論文botに相当するノイズ源が、
  # GitHubでは「arxiv-daily」「*-radar」等の自動生成Issueとして現れる。
  #
  # 【判定】取得件数では質を測れない。**母集団(total_count)を見る。**
  # per_page上限まで常に返るため、フレーズ絞り込みが効いていても件数は張り付く。
  # 目安は20〜300件。300を超えると絞りが甘く、抽出バッチを圧迫し続ける
  # （GitHub Issue本文はBluesky投稿より1〜2桁長い。ADR-0009）。
  #
  # 【構文】OR は使わない。`"too slow" OR "hard to"` はフレーズ絞り込みが
  # 効かず母集団の新着順に戻った。1キーワードに1フレーズを守る。
  #
  # 行末の [実測] は2026-08-11時点の total_count。
  keywords:
    # ── ロボティクス開発ツール (domain: robotics_tooling) ───────────────
    # hnjobsの実測で求人の32%を占めた最大領域。2026-08-11にドメインを追加した
    # （issue #71）。**収集はこのgithubセクションが主**で、Bluesky・Hacker News
    # のキーワードは持たない。開発者は困りごとを本家リポジトリのIssueへ書く
    - 'org:ros2 "hard to debug"' # [実測] 20
    - 'org:ros2 "not documented"' # [実測] 71
    - 'org:ros2 "too slow"' # [実測] 16
    - 'org:ros-navigation "too slow"' # [実測] 14
    - 'repo:moveit/moveit2 "too slow"' # [実測] 8。少ないが的確
    - 'org:foxglove "would be nice"' # [実測] 85。ロボティクス向け可視化ツール

    # ── 組込み開発 (domain: embedded_dev。求人29%) ──────────────────────
    # edge_ai とは別。あちらは「制約ハードで推論を動かす」困りごとで、
    # こちらは推論の有無によらない組込み開発そのもの
    - 'org:zephyrproject-rtos "hard to debug"' # [実測] 58
    - 'org:espressif "hard to debug"' # [実測] 102
    - 'org:espressif "documentation is confusing"' # [実測] 21
    - 'repo:platformio/platformio-core "would be nice"' # [実測] 104

    # ── D2: エッジデバイスでのAI実行 (domain: edge_ai) ──────────────────
    - 'repo:pytorch/TensorRT "not supported"' # [実測] 135
    - 'repo:microsoft/onnxruntime "slower than"' # [実測] 256

    # ── D1: AI精度・モデル評価の実務 (domain: ai_accuracy) ────────────────
    # Ultralyticsのライセンス問題は、Bluesky側でも痛みとして観測されている
    # （「AGPL3.0のため業務利用できず代替探しに苦労」）。同じ痛みの一次情報
    - 'repo:ultralytics/ultralytics "commercial license"' # [実測] 50

# ─────────────────────────────────────────────────────────────────────
# YouTube Data API クォータ
#
#   search.list = 100ユニット/回、1日の無料枠 = 10,000ユニット
#   1日の実行可能回数 ≈ 10000 / (100 × キーワード件数)
#
#   現在: キーワード9件 → 900ユニット/run → 1日11回まで
#   3時間おき(1日8回)で 7,200ユニット。約28%の余裕がある。
#
#   キーワードを12件を超えて増やす場合は、cron頻度を6時間おきへ下げること。
#
# Bluesky・Hacker News にはクォータ制限がないが、連続リクエストでスロットリング
# (403/429)が発生しうる。common/http.py が1秒のペーシングと再試行を行う。
# ─────────────────────────────────────────────────────────────────────

# 改訂履歴
#
# 2026-08-11 (2) githubキーワードの初版 (13件、ADR-0009の保留事項を解消)
#   ADR-0009で実装だけ済ませ「実データでの検証を先に行う」として保留していた
#   github: セクションを起こした。GitHub検索API(未認証)での事前確認であり、
#   収集データでの検証は初回収集後に行う。
#
#   狙いは hnjobs との対にある。hnjobsで「どの領域に予算が付いているか」が
#   分かったが、求人票には困りごとが書かれていない。同じ領域のツールへの不満を
#   本家リポジトリのIssueから拾い、「予算のある領域で何が足りていないか」を見る。
#
#   **org:/repo: での限定が必須であることが判明した。** 限定しない検索は
#   AI生成のダイジェストリポジトリが支配する。
#     ros2 "hard to debug"     30件中26件が THTHDGCS/agents-radar（単一リポジトリ）
#     robotics "too complicated" arxiv-daily 系が上位
#     opencv "memory leak"     sglang-ci-bot 等のCI自動生成Issue
#   Blueskyの論文bot・ブリッジ投稿（2026-08-02の実測）と同じ構造の問題が、
#   GitHubでは自動生成Issueとして現れる。限定を掛けると本家の一次情報だけになった。
#
#   **取得件数では質を測れない。母集団(total_count)を見る。**
#   per_pageの上限まで常に返るため、フレーズ絞り込みが効いていても件数は
#   張り付く。Blueskyでは「50件＝ノイズ」、YouTube・英語圏では件数が使えない、
#   と来たが、GitHubでは**別の指標(total_count)へ判定を移す**必要がある。
#
#   **OR構文は使えない。** `"too slow" OR "hard to"` はフレーズ絞り込みが効かず、
#   リポジトリ内の新着順に戻った（30件張り付き）。1キーワードに1フレーズを守る。
#
#   却下した候補と根拠（すべて total_count）:
#     org:espressif "documentation"          14767 → 一般語。絞りが効いていない
#     org:zephyrproject-rtos "would be nice"   602 → 多すぎ。抽出バッチを圧迫する
#     org:zephyrproject-rtos "confusing"       485 → 同上
#     repo:foxglove/studio ...                   0 → リポジトリ名が現存しない
#                                                   （org:foxglove で拾い直した）
#
#   **ロボティクス開発ツールに対応するドメインが config/domains.yaml に無い。**
#   hnjobsの実測では求人の32%を占める最大領域であり、6キーワードを充てたが、
#   現状の統制語彙では抽出時に other へ落ちる。domains.yaml の改訂が要る。
#   統制語彙の変更は既存の抽出結果との互換に関わるため、本改訂には含めない。
#   → 2026-08-11、issue #71 で robotics_tooling / embedded_dev を追加して解消。
#
# 2026-08-11 hnjobsキーワードの初版 (9件、ADR-0010)
#   Algolia検索API(認証不要)での事前確認。収集データでの検証は初回収集後に行う。
#   求人3本(2026年6〜8月のWho is hiring)・案件3本(同月のFreelancer)へ問い合わせ、
#   スレッド直下のコメント数を数えた（返信は求人票ではないので除外）。
#
#   キーワード単位（求人3本 / 案件3本）:
#     "robotics"         37 / 2  ◎
#     "machine learning" 31 / 0  ○ 領域は広いが的確
#     "embedded"         30 / 2  ◎
#     "computer vision"  21 / 3  ◎
#     "inference"        19 / 1  ○
#     "firmware"         15 / 1  ◎
#     "iot"              10 / 0  ○
#     "quantization"      3 / 0  △ 少数だが領域は的確
#     "3d printing"       0 / 0  ✕ 観測点として残す（下記）
#
#   却下した候補と根拠:
#     "real-time"       56 / 1 → 件数は最多だが領域を絞れない。一般語
#     "perception"       4 / 0 → "robotics" と重なる
#     "sensor fusion"    2 / 0 / "hardware engineer" 2 / 0 → 少数かつ他語と重複
#     "edge computing"   1 / 0 / "edge device" 0 / 0 → 求人票でこの語は使われない
#     "cnc"              0 / 0 → 下記のタイプミス吸収を切ると消えた
#     "sensor"          上限50に張り付き判定不能。「上限に達していない件数で
#                       質を判断すると誤る」(2026-08-02の教訓)の裏返しで、
#                       上限に達した件数でも判断できない
#
#   **Algoliaの既定のタイプミス吸収が、短い語を無関係な語へ広げていた。**
#     "cnc"  typoTolerance既定: 13件（不動産・請負業者マッチング等。工作機械は0件）
#            typoTolerance=false:  0件
#   hnjobs/client.py で無効化した。求人票は1件が長く、誤検知は「無関係な会社を
#   その領域の求人として数える」形で効くため、件数から領域の厚みを読む用途では
#   結論そのものが歪む。**既存の hackernews 側は既定のままである**（あちらは
#   痛み率で質を測っており、影響の測り直しが要るため本改訂では触っていない）。
#
#   **原則1（固有名詞・技術用語のアンカー）は英語の求人でも成立した。**
#     "edge" 48件 → 中身は "sharp edges"（バグの話）と "cutting-edge AI"（宣伝）。
#     エッジコンピューティングの求人は3件中1件のみ。一般語は言語を問わず機能しない。
#     複合語にすると今度は0〜1件まで落ちる（"edge computing" / "edge device"）。
#     この領域は "embedded" / "firmware" / "iot" で拾うのが実際的だった。
#
#   **案件スレッド(freelancer)は金の流れシグナルとして機能しない。** 2026年8月の
#   スレッドはトップレベル14件すべてが SEEKING WORK（フリーランス側の売り込み）で、
#   SEEKING FREELANCER（発注側）は0件だった。区別せず数えると「案件が14件ある」と
#   誤読する。発注側／受注側は posts.metrics の seeking に記録するようにした。
#   スレッド自体を外すのではなく、供給側（どの技術で個人が受注しているか）の
#   観測として役割を変えて残す。3ヶ月で5件と少なく、バッチ負荷も小さい。
#
#   **fabricationドメインの求人は存在しない。** "3d printing" も "cnc" も
#   求人・案件の両方で0件だった。SNS側では痛み率44%（3ドメイン中で突出）だった
#   領域に、企業の予算が1件も観測できない。「痛みはあるが誰も金を払っていない」
#   という、需要シグナルだけでは弾けない状態を示す最初の実測値である。
#   0件はバッチ負荷ゼロなので、判定材料として観測点に残す。
#
# 2026-08-08 (2) Hacker Newsキーワードの実データ検証 (キーワード変更なし、issue #3、ADR-0006)
#   前回(2026-08-08 (1))はAlgolia検索APIでの事前確認のみだった。今回は実際に
#   収集した203件をDBで評価した。判定はBluesky側と同じ正規表現による代理指標。
#
#   キーワード単位（件数 / 痛み率）:
#     "3d printer" failed    47 / 23%  ○ 3ドメイン中で最良
#     "raspberry pi" jetson  46 /  2%  ✗
#     "bed adhesion"         20 /  5%  △
#     "failed print"         20 /  0%  △ 話題は的確だが一人称の痛み表現が薄い
#     "model accuracy" edge  16 /  0%  ✗
#     "jetson nano"          50 /  0%  ✗
#     "quantization accuracy" 3 /  -   母数不足
#     "resin printer" failed  1 /  -   母数不足
#
#   ドメイン別（件数は重複あり。1投稿が複数キーワードにマッチしうるため）:
#     fabrication  88件  痛み14%  ← Blueskyの44%を大きく下回る
#     edge_ai      99件  痛み 1%
#     ai_accuracy  16件  痛み 0%  ← Bluesky同様の弱さが実データでも裏付けられた
#
#   **新しいノイズ源を確認した: 月次の求人スレッド「Ask HN: Who is hiring?」。**
#   "model accuracy" edge の16件中11件（69%）がこのスレッドへの定型応募コメント
#   （企業名・職種・リモート可否を列挙するテンプレート）だった。ブリッジ投稿・
#   論文bot（Bluesky）とは異なる、Hacker News固有のノイズ形態である。
#   件数が少なく抽出バッチへの負荷が小さいため、キーワード自体は残す。
#
#   **コーパスの薄さがBlueskyとの差を生んでいる。** fabricationの44%→14%への
#   低下は、キーワードの質が落ちたのではなく、母集団自体が小さく密度が薄いことが
#   主因と見られる（"3d printer" failedの47件は的確な話題が中心だが、一人称の
#   困りごと表現までは至らない「作例紹介」「技術論評」が多い）。
#
# 2026-08-08 (1) Hacker Newsキーワードの初版 (8件、issue #3、ADR-0006)
#   Algolia検索API(認証不要)での事前確認のみ。収集データでの痛み率検証は未実施。
#
#   完全一致フレーズ(4語以上)はコーパスが小さくほぼ0件になった。
#     "jetson nano slow"      0件
#     "3d print failed"       0件（Blueskyでは◎だった語がHNでは0件）
#     "resin print failed"    0件
#     "yolo false positives"  0件
#   2〜3語のフレーズ+限定語1語（"フレーズ" 追加語）に落として初めて件数が出た。
#   **同じフレーズでもプラットフォームでコーパスの厚みが根本的に違う**
#   （youtube側の改訂履歴で確認済みの教訓がHacker Newsでも再現した）。
#
#   D1(ai_accuracy)は事前確認でもノイズが支配的だった。Bluesky同様この領域は弱い。
#   件数の少ない語のみ観測点として残し、"false positives" yolo(264件、ノイズ支配)は
#   採らなかった。
#
# 2026-08-03 英語キーワードの実データ検証 (Bluesky 38件 → 36件、issue #12)
#   前回は公開検索APIでの事前実測だった。今回は実際に収集した445件をDBで評価した。
#
#   量は解決した。英語13語の1サイクル445件が、日本語22語の全期間累計394件を上回った。
#   ただし3語が上限50件付近に張り付いており、初回で在庫を回収した可能性がある。
#   継続的な流量は次のサイクルで判定する。
#
#   質はドメインで割れた。判定は「bot類を除いた上で一人称の困りごと表現を含む割合」
#   （i tried / doesn't work / any advice / too slow 等の正規表現。粗い代理指標）。
#   **すべて 2026-08-03T14:05Z 時点のDB（bluesky 843件）で引いた値。**
#   cronが3時間おきに収集を続けるため、後から引き直すと数字は動く。
#
#     fabrication  184件  44%   ← 日本語全体(7%)の6倍
#     edge_ai      118件  12%   ← 下の2語を削除した後の4語での値
#     ai_accuracy    5件   0%
#
#   edge_ai は削除前の6語だと 199件 7% だった。痛み率0%の2語を抜いたことで
#   12%へ上がる。**削除前後で数字が変わる点に注意すること。**
#
#   キーワード単位（件数 / bot率 / 痛み率）:
#     resin print failed    48 /  0% / 81%  ◎
#     3d print failed       50 /  4% / 65%  ◎
#     jetson nano slow       9 /  0% / 33%  ◎ 少数だが密度は最高
#     first layer adhesion  50 / 32% / 24%  ○ bot比率は最悪だが実signalも多い
#     local llm slow        48 / 23% / 19%  ○ D2では最良
#     3d printing jig       25 / 16% / 10%  △
#     ollama slow           49 / 14% /  7%  △
#     robot arm diy         43 / 23% /  3%  △
#     llama.cpp raspberry pi 39 / 23% /  3%  △
#     coral tpu             47 / 19% /  0%  ✗ 削除
#     frigate detection     49 / 12% /  0%  ✗ 削除
#
#   削除した2語の根拠:
#     内容はノイズではない（Frigate NVRの構築報告など実運用の話）。しかし
#     **Blueskyは需要シグナル用**と役割を定義してある。既存ソリューションを
#     どう組んだかは供給シグナルであり、役割と合わない。
#     この2語だけで毎サイクル96件が抽出バッチへ載り、Phase 2のセッション時間を
#     食う。件数の割にシグナル密度が無いものから外す。
#
#     **削除が効くのは将来分だけである。** 既に収集した89件（他の語では拾えて
#     いない投稿）は extraction_status='pending' のまま残り、Phase 2 の最初の
#     バッチに載る。直近のバッチは1件も減らない。
#     既存分まで外すならDBの状態変更（'skipped' への更新）が要るが、それは
#     設定の変更ではないためここでは行わない。
#
#   痛み率0%でも残した2語（confidence threshold tuning / yolo false positives）:
#     合計6件しかなく、抽出バッチへの負荷がほぼ無い。英語圏のD1に需要シグナルが
#     現れるかを見続ける観測点として維持する。判断基準は
#     「抽出バッチへの負荷 × シグナル密度」であり、件数僅少なら密度0でも残す。
#
#   bot・ブリッジ投稿は収集段階で落とさない (混入率15〜17%):
#     ハンドル名で機械的に判定できる（*.brid.gy / *-bot.bsky.social /
#     spacefeed / longtail-news 等）が、収集で落とすとJSONLに残らず復元できない。
#     **生データを捨てない**（design.md 方針1.3）ため、除外は分析・抽出側で行う。
#
# 2026-08-02 英語キーワードの追加 (Bluesky 25件 → 38件、issue #12)
#   日本語圏の在庫を初回収集で回収しきったため（48時間・18回実行で新規ゼロ、
#   収集済み393件が11年分の全数）、主軸を英語へ移す。
#
#   採用にあたり候補34件を公開検索APIで実測した（SeenStoreを汚さないため
#   収集は行わず、検索結果の件数・上位アカウント・本文のみを確認した）。
#
#   得られた最大の知見は、**ノイズの在り処が言語で変わる**ことである。
#     日本語: 語境界が無いことによる部分一致（量子化 → 量子化學）。件数に比例した
#     英語:   語の衝突は起きにくい。代わりにアカウント種別に宿る
#
#   英語のノイズを出していたアカウント種別（原則3の判定材料）:
#     *.web.brid.gy / *.ap.brid.gy   HuggingFaceフォーラム・ActivityPubのブリッジ
#     *-bot.bsky.social              arXiv論文bot（cscv-bot / cslg-bot 等）
#     aichina.news / spacefeed 他    技術ニュースの自動投稿
#
#   却下した候補と根拠（すべて実測）:
#     cuda out of memory   50件 → HuggingFaceブリッジが23件
#     raspberry pi inference 48件 → ActivityPubブリッジ・製品発表
#     int8 quantization    46件 → aichina.news 13件 + 論文bot
#     edge device inference 49件 → arxiv-daily-bot 7件
#     jetson orin          48件 → 製品ニュース（日本語版と同じ結論）
#     coco dataset         49件 → HuggingFaceブリッジ 9件 + 論文bot
#     class imbalance dataset 50件 → 論文bot 12件
#     yolo training / yolo inference → 「YOLO mode」(AIエージェントの用語)と衝突
#     annotation tedious / labeling data tedious → 同一マーケアカウントの連投
#     onnx runtime error / tensorrt conversion → 件数は少ないがブリッジのみ
#     gimbal diy           25件 → DJI規制のニュースbotが支配
#     stepper motor        49件 → 話題が拡散しすぎて領域を絞れない
#     klipper config       24件 → 最新が4ヶ月前。鮮度が足りない
#
#   issue #12 が挙げた `inference too expensive` は採らなかった。
#   上限25件での観測では良好だったが、50件で引くと推論コストの相場ニュースと
#   RTが支配的だった。**上限に達していない件数で質を判断すると誤る。**
#
#   D1(ai_accuracy)は英語圏でも生の声が薄く、2件しか残らなかった。
#   この領域はSNSではなく別の検証手段が要る可能性がある（domains.yaml に記録）。
#
#   ニュース・プレスbotの除外機構は入れていない。上のとおりキーワード選定で
#   避けられており、実データ上の混入比率が分かる前に仕組みを足すと、
#   効果を測れないゲートだけが残るため。次回のサンプリングで比率を見て判断する。
#
# 2026-07-29 (4) YouTube側の実測検証 (キーワード変更なし)
#   初回収集215件を確認し、9キーワードすべてが的確であることを確認した。
#   Blueskyで問題となった原則1(一般語のノイズ)・原則2(英字のみの言語ノイズ)は
#   いずれも発現しなかった。Googleの関連度ランキングが有効に働くため。
#
#   同一キーワードでもプラットフォームで結果が根本的に異なる好例:
#     "パラレルリンク"       Bluesky: 遊戯王のカード(23件) ✗
#     "パラレルリンク ロボット" YouTube: FANUC M-2iA、山洋電気の産業機 ◎
#   → キーワードは必ずプラットフォーム別に検証すること。
#
#   観察(現時点では対処不要):
#     - 同一タイトルで異なるvideo_idの重複が3組。チャンネルの再アップロード。
#       増えるようなら Phase 1 のロード時に (channel_id, title) で重複排除する。
#     - チャンネル偏り: "よなべファクトリー" が10件(4.7%)。
#       多作な投稿者は市場の関心度と等価ではないため、供給シグナルの集計時に
#       チャンネル単位の正規化が必要になる可能性がある。
#
