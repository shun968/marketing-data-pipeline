pre-commit:
  # 逐次実行する。no-private-data を先頭に置き、混入を検出したら
  # 他ジョブの出力に埋もれる前に中断させる
  jobs:
    - name: no-private-data
      run: ./scripts/check-no-private-data.sh

    - name: adr-format
      glob: "docs/adr/*.md"
      run: ./scripts/check-adr-format.sh {staged_files}

    # 検査スクリプト自体が変わったときだけ回す。
    # 常時実行すると毎コミットに1.6秒上乗せされる
    - name: check-scripts-test
      glob: "scripts/**"
      run: ./scripts/tests/run-all.sh

    # シェル・YAMLが変わったときだけ回す。CI(guards)と同じスクリプトを呼ぶ。
    # --staged を付けないと未追跡の一時スクリプトまで検査対象になり、
    # 無関係なコミットが止まる
    - name: lint-scripts
      glob: "*.{sh,yml,yaml}"
      run: ./scripts/lint-scripts.sh --staged

    - name: lint
      run: ./scripts/lint-projects.sh --staged-only

prepare-commit-msg:
  jobs:
    - name: suggest-commit-msg
      run: ./scripts/suggest-commit-msg.sh {1}

commit-msg:
  parallel: true
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}
