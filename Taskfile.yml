version: '3'

vars:
  REPO:
    sh: gh repo view --json nameWithOwner -q .nameWithOwner

tasks:
  setup:
    desc: 初期セットアップ(依存関係インストール・gitフック登録)
    cmds:
      - npm install

  test-check-scripts:
    desc: pre-commitフックの検査スクリプト(scripts/check-*.sh)をテストする
    summary: |
      収集データ・秘匿情報の混入検査とADR書式検査の回帰テストを実行する。

      これらのスクリプトはリポジトリでもっとも重い制約(収集データを外部へ出さない)を
      守る唯一の機構であり、壊れても通常の開発では気づけない。
      pre-commitでも scripts/ の変更時に自動実行される。
    cmds:
      - ./scripts/tests/check-no-private-data.test.sh
      - ./scripts/tests/check-adr-format.test.sh

  setup-github-repo-rules:
    desc: GitHubリポジトリ設定を標準ルールに揃える
    summary: |
      前提: gh CLIでログイン済み、対象リポジトリへのadmin権限があること

      適用内容:
        1. デフォルトブランチを main に統一
        2. マージ方式を Squash/Rebase のみに制限
        3. マージ後に head ブランチを自動削除
        4. develop ブランチが残っていれば削除
        5. "main" を含む名称のブランチを保護する Ruleset を作成/更新
           - PR必須(直接pushの禁止)
           - 会話(スレッド)解決必須
           - CIの成功必須(guards / sns-collector)
           - force-push禁止
           - ブランチ削除禁止
           - 直線的な履歴を必須化(マージコミット禁止・ff-onlyのみ許可)

      CIをマージ条件にしている理由:
        pre-commitフック(lefthook)はローカルの善意に依存し、
        git commit --no-verify で素通りする。GitHub UI上での直接編集にも効かない。
        収集データの混入検査はこのリポジトリでもっとも重い制約を守る唯一の機構であり、
        一度pushすると事後の取り消しが効かないため、サーバ側でも検証する。

        context 名は .github/workflows/ci.yml のジョブ名と一致させること。
        ここを変えるとチェックが永久にpendingになり、マージできなくなる。

        strict_required_status_checks_policy は false にしている。
        true にすると base が進むたびに rebase を要求されるが、
        required_linear_history と併せると開発者1人には負担が大きい。

      ブランチ自動削除について:
        gh pr merge --delete-branch を毎回付けても、GitHubのUIから
        マージした場合には効かない。リポジトリ設定にすればマージ経路に
        依存しなくなる。
        削除後もPRページの Restore branch から復元でき、
        変更内容は squash 後のコミットとして main に残る。

        ただし下記 Ruleset の deletion ルールが優先されるため、
        条件 refs/heads/*main* にマッチするブランチは削除されない。
        パターンの * は / にマッチしないので、対象は
        スラッシュを含まないブランチ名に限られる。
          domain-model, mymain  -> 削除されない(ルール適用)
          feat/domain-model     -> 削除される(ルール非適用)
        feat/ fix/ chore/ のプレフィクス規約に従う限り問題にならないが、
        トップレベルに main を含む名前のブランチを切らないこと。

      承認要件について:
        required_approving_review_count / require_code_owner_review /
        require_last_push_approval はいずれも 0 / false としている。
        GitHubは自分自身のPRを自分で承認できないため、開発者が1人の間は
        これらを有効にすると構造的に満たせず、admin bypass の常用を強いられる。

        代わりに required_review_thread_resolution を残し、
        レビュー指摘を解決しない限りマージできない状態を維持する。

        共同開発者が増えたら承認要件を戻すこと。
        その時点で .github/CODEOWNERS が機能する。

      bypass_actors を空にしている理由:
        以前は Admin ロールに bypass_mode: "pull_request" を与えていたが、
        これは PR 経由のマージ時に pull_request ルール自体を迂回できる。
        スレッド解決も迂回対象に含まれるため、唯一のメンテナが Admin である
        以上、未解決のレビュー指摘を残したままマージできてしまっていた。
        承認要件を 0 にした今、bypass する理由がないため空にする。

      スレッド解決の限界(把握した上で運用すること):
        このルールは「未解決のコメントがある PR」しか止められない。
        レビューを一度も走らせなければコメントはゼロで、素通りする。
        また作成者自身がスレッドを解決できる。
        強制力のあるゲートではなく、対応漏れを防ぐ仕組みである。
        レビューの実行そのものは運用で担保する(CLAUDE.md 参照)。

      使い方: task setup-github-repo-rules [REPO=owner/repo]
        REPO省略時はカレントディレクトリのリポジトリを対象にする
    cmds:
      - |
        set -euo pipefail
        REPO={{.REPO}}

        if ! gh api "repos/${REPO}/branches" --paginate -q '.[].name' | grep -qx 'main'; then
          current_default=$(gh api "repos/${REPO}" -q .default_branch)
          sha=$(gh api "repos/${REPO}/git/refs/heads/${current_default}" -q .object.sha)
          gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/main" -f sha="${sha}" >/dev/null
          echo "main ブランチを作成完了(${current_default}から分岐)"
        fi

        gh api -X PATCH "repos/${REPO}" -f default_branch=main >/dev/null
        echo "デフォルトブランチをmainに変更完了"

        gh api -X PATCH "repos/${REPO}" -F allow_merge_commit=false >/dev/null
        echo "マージコミットの作成を無効化完了(Squash/Rebaseのみ許可)"

        gh api -X PATCH "repos/${REPO}" -F delete_branch_on_merge=true >/dev/null
        echo "マージ後のブランチ自動削除を有効化完了"

        if gh api "repos/${REPO}/branches" --paginate -q '.[].name' | grep -qx 'develop'; then
          gh api -X DELETE "repos/${REPO}/git/refs/heads/develop"
          echo "develop ブランチを削除完了"
        else
          echo "develop ブランチは存在しないためスキップ"
        fi

        branch_ruleset_id=$(gh api "repos/${REPO}/rulesets" -q ".[] | select(.name==\"protect-main-branches\") | .id")

        # bypass_actors.actor_id: 1=Read,2=Triage,3=Write,4=Maintain,5=Admin
        branch_payload=$(cat <<JSON
        {
          "name": "protect-main-branches",
          "target": "branch",
          "enforcement": "active",
          "bypass_actors": [],
          "conditions": {
            "ref_name": {
              "include": ["refs/heads/*main*"],
              "exclude": []
            }
          },
          "rules": [
            { "type": "deletion" },
            { "type": "non_fast_forward" },
            { "type": "required_linear_history" },
            {
              "type": "required_status_checks",
              "parameters": {
                "strict_required_status_checks_policy": false,
                "required_status_checks": [
                  { "context": "guards" },
                  { "context": "sns-collector" }
                ]
              }
            },
            {
              "type": "pull_request",
              "parameters": {
                "required_approving_review_count": 0,
                "dismiss_stale_reviews_on_push": true,
                "require_code_owner_review": false,
                "require_last_push_approval": false,
                "required_review_thread_resolution": true
              }
            }
          ]
        }
        JSON
        )

        if [ -n "${branch_ruleset_id}" ]; then
          echo "${branch_payload}" | gh api -X PUT "repos/${REPO}/rulesets/${branch_ruleset_id}" --input - >/dev/null
        else
          echo "${branch_payload}" | gh api -X POST "repos/${REPO}/rulesets" --input - >/dev/null
        fi

        echo "デフォルトのgithub setting完了"

  lint:
    desc: 各プロジェクト(package.jsonにlintスクリプトを持つ直下のディレクトリ)でlintを実行する
    summary: |
      tutorial/ など、package.jsonに"lint"スクリプトを持つ直下のディレクトリを自動検出してnpm run lintを実行する。
      新しいプロジェクトディレクトリが増えても、package.jsonにlintスクリプトさえあれば自動的に対象になる。
    cmds:
      - ./scripts/lint-projects.sh

  sns-collector:setup:
    desc: sns-collectorのPython依存関係をインストールする
    dir: sns-collector
    cmds:
      - uv sync
