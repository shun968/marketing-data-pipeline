name: Claude Review

# PR作成・更新のたびにレビューをヘッドレスで走らせる。
#
# なぜCIに置くか:
#   ruleset の required_review_thread_resolution は「未解決コメントがあるPR」しか
#   止められず、レビューを一度も走らせなければコメントはゼロで素通りする。
#   人の記憶に頼る運用をイベント駆動に置き換える。
#
# 課金について:
#   claude_code_oauth_token はサブスクリプションの付与分を使う。
#   使い切ると実行が失敗するため continue-on-error で受け止め、
#   レビューが走らなかった旨のコメントだけ残してCIは緑にする。
#   このジョブを ruleset の required_status_checks に入れないこと。
#   入れると上限到達がそのままマージ不能になる。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 連続pushで古いレビューを打ち切る。上限は有限で、捨てる実行に使わない
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    name: claude-review
    # forkからのPRにはsecretsが渡らず、必ず上限到達と区別できない失敗になる。
    # 回す前に落とす
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # プラグインには owner/repo/pull/N を渡しており、差分はGitHub API経由で取れる。
      # 全履歴が要るかは未検証のため、既定の浅いクローンのままにしておく。
      # レビューが差分を取れていなければ初回実行で分かる
      - uses: actions/checkout@v4

      - name: claude code review
        id: review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # opus は「その時点の最新Opus」を指すエイリアス。
          # 世代が上がってもこのファイルを書き換えずに追従する。
          #
          # --max-turns を明示する理由:
          #   既定は10で、上限に達するとアクションは失敗せず正常終了する。
          #   複数エージェントで差分を分担するプラグインには足りず、
          #   指摘が一部しか出ないまま緑になる経路になる。
          #   この値は暫定。実行ログのターン数を見て調整すること
          claude_args: |
            --model opus
            --max-turns 40

      # 「失敗したか」ではなく「レビューが実行された形跡があるか」で判定する。
      #
      # アクションはワークフローファイルがデフォルトブランチと一致しないとき、
      # 失敗ではなく success で自らスキップする(PRからのプロンプト書き換えを防ぐ
      # 安全機構)。終了状態だけを見ていると、レビューが1行も走っていないPRが
      # 緑・コメント0件のまま素通りする。#31 で実測した。
      - name: notify unreviewed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- claude-review-skipped -->"
        run: |
          if [ "${REVIEW_OUTCOME}" = "success" ] &&
             [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            echo "レビューが実行されたため案内は出さない"
            exit 0
          fi

          # アクションはSDKの出力を既定で伏せる(差分やレビュー本文が出るため)。
          # 伏せたままだと失敗の原因が終了コードしか残らず、上限到達なのか
          # プロンプトの解決失敗なのかを切り分けられない。
          # このステップは「レビューが成立しなかったとき」しか動かないため、
          # ここに出るのはエラー文であってレビュー本文ではない
          if [ -f "${EXECUTION_FILE}" ]; then
            echo "--- 実行結果の要約 ---"
            jq -r '
              (if type == "array" then .[-1] else . end) as $r
              | "type=\($r.type // "?") subtype=\($r.subtype // "?")"
                + " is_error=\($r.is_error // "?") num_turns=\($r.num_turns // "?")",
                "message=\((($r.result // $r.error // $r.message) // "") | tostring | .[0:600])"
            ' "${EXECUTION_FILE}" 2>/dev/null || echo "実行ログをJSONとして解釈できなかった"
            echo "--- ここまで ---"
          fi

          # 走らなかった理由(上限到達・認証切れ・アクション側のスキップ)は
          # 機械的に判別しない。実行ログにはPRの差分とレビュー本文がそのまま入るため、
          # `quota` や `credit` を含む変更を見ただけで「上限到達」と誤って断定する。
          # 誤った理由は「実行に失敗した」より悪く、原因調査の初手を外させる。
          # 推測を書かず実行URLだけ案内し、判断は人に渡す

          # 同じPRへ push するたびに同じ案内を積まない。
          # 取得に失敗したときは重複を許して投稿する。案内が出ないことのほうが重い
          existing="$(gh pr view "${PR_NUMBER}" --json comments \
            --jq "[.comments[] | select(.body | contains(\"${MARKER}\"))] | length" \
            2>/dev/null)" || existing="0"
          if [ "${existing}" != "0" ]; then
            echo "案内コメントは投稿済みのため何もしない"
            exit 0
          fi

          # YAMLブロックのインデントが本文に混ざると```がコードブロック内に入る。
          # 行ごとにprintfで組み立てる
          body="$(printf '%s\n%s\n\n%s\n\n%s\n\n%s\n%s\n%s\n' \
            "${MARKER}" \
            "自動レビューが実行されなかった。" \
            "理由は実行ログを見ること: ${RUN_URL}" \
            "マージ前に、手元のClaude Codeセッションで次を実行すること。" \
            '```' \
            "/code-review ${PR_NUMBER} --comment" \
            '```')"
          gh pr comment "${PR_NUMBER}" --body "${body}"
