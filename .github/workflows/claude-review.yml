name: Claude Review

# PR作成・更新のたびにレビューをヘッドレスで走らせる。
#
# なぜCIに置くか:
#   ruleset の required_review_thread_resolution は「未解決コメントがあるPR」しか
#   止められず、レビューを一度も走らせなければコメントはゼロで素通りする。
#   人の記憶に頼る運用をイベント駆動に置き換える。
#
# 課金について:
#   claude_code_oauth_token はサブスクリプションの付与分を使う。
#   使い切ると実行が失敗するため continue-on-error で受け止め、
#   スキップした旨のコメントだけ残してCIは緑にする。
#   このジョブを ruleset の required_status_checks に入れないこと。
#   入れると上限到達がそのままマージ不能になる。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 連続pushで古いレビューを打ち切る。上限は有限で、捨てる実行に使わない
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    name: claude-review
    # forkからのPRにはsecretsが渡らず、必ず上限到達と区別できない失敗になる。
    # 回す前に落とす
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # レビュー対象はbaseとの差分。履歴が要る
          fetch-depth: 0

      - name: claude code review
        id: review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # opus は「その時点の最新Opus」を指すエイリアス。
          # 世代が上がってもこのファイルを書き換えずに追従する
          claude_args: --model opus

      # 失敗の原因が上限到達かどうかは終了コードでは分からないため、
      # 実行ログの本文で判別する。判別に失敗しても案内内容は変わらない
      - name: notify skipped
        if: steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          MARKER: "<!-- claude-review-skipped -->"
        run: |
          reason="実行に失敗した"
          if [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            if grep -qiE 'usage limit|rate limit|quota|credit' "${EXECUTION_FILE}"; then
              reason="サブスクリプションの付与分を使い切った"
            fi
          fi

          # 同じPRへ push するたびに同じ案内を積まない
          existing="$(gh pr view "${PR_NUMBER}" --json comments \
            --jq "[.comments[] | select(.body | contains(\"${MARKER}\"))] | length")"
          if [ "${existing}" != "0" ]; then
            echo "案内コメントは投稿済みのためスキップする"
            exit 0
          fi

          # YAMLブロックのインデントが本文に混ざると```がコードブロック内に入る。
          # 行ごとにprintfで組み立てる
          body="$(printf '%s\n%s\n\n%s\n\n%s\n%s\n%s\n' \
            "${MARKER}" \
            "自動レビューをスキップした（${reason}）。" \
            "マージ前に、手元のClaude Codeセッションで次を実行すること。" \
            '```' \
            "/code-review ${PR_NUMBER} --comment" \
            '```')"
          gh pr comment "${PR_NUMBER}" --body "${body}"
